
name: Terraform Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  STATE_BUCKET: devncloudtechdevopsrrr
  STATE_KEY: terraform.tfstate

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubTerraformPlan

      - name: Verify AWS identity and S3 access
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

          aws s3api get-bucket-location \
            --bucket "$STATE_BUCKET"

          aws s3api list-objects-v2 \
            --bucket "$STATE_BUCKET" \
            --prefix "$STATE_KEY" \
            --max-items 5

          if aws s3api head-object \
            --bucket "$STATE_BUCKET" \
            --key "$STATE_KEY" >/dev/null 2>&1; then
            echo "State object is accessible."
          else
            echo "State HEAD failed or object missing."
            echo "Check S3 permissions if init fails."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubTerraformApply

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: .

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
